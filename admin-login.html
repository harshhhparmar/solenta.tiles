<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Solenta Tiles</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0B0C;
    --porcelain:#EDEAE3;
    --paper:#FAF9F6;
    --glaze:#3F9D57;
    --glaze-deep:#276B3D;
    --glaze-tint:#DFEFE2;
    --ember:#E2762E;
    --stone:#726C60;
    --line:#D8D4C9;
    --line-dark:#333331;
    --radius:2px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--porcelain);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  a{color:inherit;}
  .card{
    width:100%;
    max-width:400px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:40px 36px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--glaze-deep);
    margin-bottom:10px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:26px;
    letter-spacing:-0.01em;
    margin-bottom:28px;
  }
  label{
    display:block;
    font-size:13px;
    font-weight:500;
    margin-bottom:6px;
    color:var(--stone);
  }
  .field{ margin-bottom:18px; }
  input{
    width:100%;
    padding:12px 14px;
    font-family:inherit;
    font-size:15px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    color:var(--ink);
  }
  input:focus{ outline:none; border-color:var(--glaze); }
  button{
    width:100%;
    padding:13px 14px;
    margin-top:8px;
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:15px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:var(--radius);
    cursor:pointer;
    transition:background .2s ease;
  }
  button:hover{ background:var(--glaze-deep); }
  button:disabled{ opacity:0.6; cursor:not-allowed; }
  .msg{
    display:none;
    margin-top:16px;
    padding:10px 12px;
    font-size:13px;
    border-radius:var(--radius);
    line-height:1.4;
  }
  .msg.error{ display:block; background:#FBEAE0; color:#A6431A; }
  .msg.info{ display:block; background:var(--glaze-tint); color:var(--glaze-deep); }
  .back{
    display:inline-block;
    margin-top:24px;
    font-size:13px;
    color:var(--stone);
  }
  .back:hover{ color:var(--ink); }
</style>
</head>
<body>

  <div class="card">
    <div class="eyebrow">Solenta Tiles</div>
    <h1>Admin Login</h1>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" required autocomplete="current-password">
      </div>
      <button type="submit" id="loginBtn">Sign in</button>
      <div class="msg" id="formMsg"></div>
    </form>

    <a href="index.html" class="back">← Back to site</a>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  const SUPABASE_URL = 'https://durvxhvttqbrakvikwfk.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_qP2TTPF5xSKuACUcEIS4ng_n25nZYH9';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function showMsg(text, type){
    const el = document.getElementById('formMsg');
    el.textContent = text;
    el.className = 'msg ' + type;
  }

  // If already logged in, skip straight to dashboard
  (async function checkExistingSession(){
    const { data } = await sb.auth.getSession();
    if (data && data.session) {
      window.location.href = 'admin-dashboard.html';
    }
  })();

  document.getElementById('loginForm').addEventListener('submit', async function(e){
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');

    btn.disabled = true;
    btn.textContent = 'Signing in…';

    const { data, error } = await sb.auth.signInWithPassword({ email, password });

    if (error) {
      btn.disabled = false;
      btn.textContent = 'Sign in';
      showMsg('Incorrect email or password.', 'error');
      return;
    }

    showMsg('Signed in — redirecting…', 'info');
    window.location.href = 'admin-dashboard.html';
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Solenta Tiles</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0B0C;
    --porcelain:#EDEAE3;
    --paper:#FAF9F6;
    --glaze:#3F9D57;
    --glaze-deep:#276B3D;
    --glaze-tint:#DFEFE2;
    --ember:#E2762E;
    --stone:#726C60;
    --line:#D8D4C9;
    --line-dark:#333331;
    --radius:2px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--porcelain);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  a{color:inherit;}
  .card{
    width:100%;
    max-width:400px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:40px 36px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--glaze-deep);
    margin-bottom:10px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:26px;
    letter-spacing:-0.01em;
    margin-bottom:10px;
  }
  .sub{
    font-size:13px;
    color:var(--stone);
    margin-bottom:26px;
  }
  label{
    display:block;
    font-size:13px;
    font-weight:500;
    margin-bottom:6px;
    color:var(--stone);
  }
  .field{ margin-bottom:18px; }
  input{
    width:100%;
    padding:12px 14px;
    font-family:inherit;
    font-size:15px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    color:var(--ink);
  }
  input:focus{ outline:none; border-color:var(--glaze); }
  .hint{ font-size:12px; color:var(--stone); margin-top:6px; }
  button{
    width:100%;
    padding:13px 14px;
    margin-top:8px;
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:15px;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:var(--radius);
    cursor:pointer;
    transition:background .2s ease;
  }
  button:hover{ background:var(--glaze-deep); }
  button:disabled{ opacity:0.6; cursor:not-allowed; }
  .msg{
    display:none;
    margin-top:16px;
    padding:10px 12px;
    font-size:13px;
    border-radius:var(--radius);
    line-height:1.4;
  }
  .msg.error{ display:block; background:#FBEAE0; color:#A6431A; }
  .msg.info{ display:block; background:var(--glaze-tint); color:var(--glaze-deep); }
  .back{
    display:inline-block;
    margin-top:24px;
    font-size:13px;
    color:var(--stone);
  }
  .back:hover{ color:var(--ink); }
  .state{ text-align:center; color:var(--stone); font-size:14px; padding:20px 0; }
</style>
</head>
<body>

  <div class="card">
    <div class="eyebrow">Solenta Tiles</div>

    <!-- Shown only until the one admin account is created -->
    <div id="setupView" style="display:none;">
      <h1>Create Admin Account</h1>
      <p class="sub">No admin account exists yet. Set one up now — this can only be done once.</p>
      <form id="setupForm">
        <div class="field">
          <label for="setupEmail">Email</label>
          <input id="setupEmail" type="email" required autocomplete="username">
        </div>
        <div class="field">
          <label for="setupPassword">Password</label>
          <input id="setupPassword" type="password" required autocomplete="new-password" minlength="8">
          <div class="hint">At least 8 characters.</div>
        </div>
        <div class="field">
          <label for="setupPassword2">Confirm password</label>
          <input id="setupPassword2" type="password" required autocomplete="new-password" minlength="8">
        </div>
        <button type="submit" id="setupBtn">Create account</button>
        <div class="msg" id="setupMsg"></div>
      </form>
    </div>

    <!-- Shown once an admin account already exists -->
    <div id="loginView" style="display:none;">
      <h1>Admin Login</h1>
      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" required autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" required autocomplete="current-password">
        </div>
        <button type="submit" id="loginBtn">Sign in</button>
        <div class="msg" id="loginMsg"></div>
      </form>
    </div>

    <div id="checkingView" class="state">Checking…</div>

    <a href="index.html" class="back">← Back to site</a>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  const SUPABASE_URL = 'https://durvxhvttqbrakvikwfk.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_qP2TTPF5xSKuACUcEIS4ng_n25nZYH9';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const checkingView = document.getElementById('checkingView');
  const setupView = document.getElementById('setupView');
  const loginView = document.getElementById('loginView');

  function showMsg(elId, text, type){
    const el = document.getElementById(elId);
    el.textContent = text;
    el.className = 'msg ' + type;
  }

  async function init(){
    // Already signed in? Skip straight to dashboard.
    const { data: sessionData } = await sb.auth.getSession();
    if (sessionData && sessionData.session) {
      window.location.href = 'admin-dashboard.html';
      return;
    }

    // Has the one-time admin account already been created?
    const { data: setupRow, error } = await sb
      .from('admin_setup')
      .select('is_configured')
      .eq('id', 1)
      .single();

    checkingView.style.display = 'none';

    if (error) {
      // Most likely cause: the admin_setup table/SQL hasn't been run yet
      // in Supabase. Default to the CREATE ACCOUNT view (not login) so a
      // first-time admin never gets stuck staring at a login form with no
      // account to sign into — and surface why, so it's easy to diagnose.
      console.error('admin_setup check failed:', error);
      setupView.style.display = 'block';
      showMsg(
        'setupMsg',
        'Note: could not confirm setup status (' + (error.message || 'admin_setup table not found') + '). ' +
        'If this is truly the first time, make sure the admin_setup SQL from the README has been run in Supabase — the account can still be created below, but the "only once" lock will not be enforced until that table exists.',
        'error'
      );
      return;
    }

    if (setupRow && setupRow.is_configured) {
      loginView.style.display = 'block';
    } else {
      setupView.style.display = 'block';
    }
  }
  init();

  document.getElementById('setupForm').addEventListener('submit', async function(e){
    e.preventDefault();
    const email = document.getElementById('setupEmail').value.trim();
    const password = document.getElementById('setupPassword').value;
    const password2 = document.getElementById('setupPassword2').value;
    const btn = document.getElementById('setupBtn');

    if (password !== password2) {
      showMsg('setupMsg', 'Passwords do not match.', 'error');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Creating…';

    const { data: signUpData, error: signUpError } = await sb.auth.signUp({ email, password });

    if (signUpError) {
      btn.disabled = false;
      btn.textContent = 'Create account';
      showMsg('setupMsg', signUpError.message || 'Could not create the account.', 'error');
      return;
    }

    // Supabase deliberately returns success (no error) when the email is
    // already registered, to avoid leaking which emails have accounts. The
    // giveaway is an empty identities array. Catch it so this doesn't look
    // like a fresh account got created with the password just typed in,
    // when really the pre-existing account (and its old password) is the
    // one that actually works.
    if (signUpData && signUpData.user && Array.isArray(signUpData.user.identities) && signUpData.user.identities.length === 0) {
      btn.disabled = false;
      btn.textContent = 'Create account';
      showMsg(
        'setupMsg',
        'This email already has an account (likely from earlier setup or testing) — the password just entered was NOT applied to it. Either sign in with whatever password that account already has, or in Supabase go to Authentication → Users, delete it, then reload this page to start clean.',
        'error'
      );
      return;
    }

    // Flip the one-time flag so this form can never run again.
    await sb.from('admin_setup').update({ is_configured: true }).eq('id', 1).eq('is_configured', false);

    if (signUpData.session) {
      showMsg('setupMsg', 'Account created — redirecting…', 'info');
      window.location.href = 'admin-dashboard.html';
    } else {
      showMsg('setupMsg', 'Account created. Check your email to confirm it, then come back and sign in.', 'info');
      btn.disabled = false;
      btn.textContent = 'Create account';
      setTimeout(function(){
        setupView.style.display = 'none';
        loginView.style.display = 'block';
      }, 2500);
    }
  });

  document.getElementById('loginForm').addEventListener('submit', async function(e){
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');

    btn.disabled = true;
    btn.textContent = 'Signing in…';

    const { error } = await sb.auth.signInWithPassword({ email, password });

    if (error) {
      btn.disabled = false;
      btn.textContent = 'Sign in';
      console.error('signInWithPassword failed:', error);
      let msg = error.message || 'Sign-in failed.';
      if (/email not confirmed/i.test(msg)) {
        msg = 'Email not confirmed yet. Check your inbox for the confirmation link from Supabase, or in Supabase go to Authentication → Users, open your account, and confirm it manually.';
      } else if (/invalid login credentials/i.test(msg)) {
        msg = 'Incorrect email or password.';
      } else if (/signups not allowed/i.test(msg)) {
        msg = 'Sign-ups are disabled for this project — that only affects account creation, not sign-in. If you never finished creating the account, re-enable "Allow new users to sign up" in Supabase temporarily.';
      }
      showMsg('loginMsg', msg, 'error');
      return;
    }

    showMsg('loginMsg', 'Signed in — redirecting…', 'info');
    window.location.href = 'admin-dashboard.html';
  });
</script>
</body>
</html>
